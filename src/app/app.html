<header class="modern-header" [class.scrolled]="isScrolled">
  <div class="header-container">
    
    <!-- Logo -->
    <a routerLink="/" class="brand-logo">
      <img src="/assets/images/logo.jpg" alt="Logo UNJCI" />
    </a>

    <!-- Navigation Principale -->
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        Accueil
      </a>
      <a routerLink="/application" routerLinkActive="active" class="nav-link">
        Adhésion
      </a>
      <a routerLink="/carte" routerLinkActive="active" class="nav-link">
        Ma carte
      </a>
      <a routerLink="/verification" routerLinkActive="active" class="nav-link">
        Scanner une carte
      </a>
    </nav>

    <!-- Actions (Connexion / Espace Membre) -->
    <div class="header-actions">
      <a routerLink="/login" class="btn-login">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        Espace Membre
      </a>
      
      <!-- Bouton Menu Mobile (Hamburger) -->
      <button class="mobile-menu-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>

  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="modern-footer">
  Prototype UNJCI • Les données sont stockées localement dans le navigateur.
</footer>
